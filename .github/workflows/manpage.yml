name: Building man page, man.test, manpcre2.test
on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/manpage.yml'
      - 'docs/**'
      - 'tests/man.test'
      - 'tests/manpcre2.test'
      - 'jq.1.prebuilt'
  pull_request:
    paths:
      - '.github/workflows/manpage.yml'
      - 'docs/**'
      - 'tests/man.test'
      - 'tests/manpcre2.test'
      - 'jq.1.prebuilt'

jobs:
  manpages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pipenv
      - name: Install pipenv
        run: pip install pipenv
      - name: Install dependencies
        run: pipenv sync
        working-directory: docs
      - name: Validate manual schema
        run: pipenv run python3 validate_manual_schema.py content/manual/**/*.yml
        working-directory: docs
      - name: Configure
        run: |
          autoreconf -i
          ./configure --enable-docs
      - name: Build man page, man.test, manpcre2.test
        run: |
          rm -f jq.1.prebuilt tests/man.test tests/manpcre2.test
          make jq.1.prebuilt tests/man.test tests/manpcre2.test
      - name: Make sure that jq.1.prebuilt, man.test, manpcre2.test are up to date
        run: |
          git diff --exit-code jq.1.prebuilt tests/man.test tests/manpcre2.test
